<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Music Tray Player</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <main class="app">
      <section class="workspace">
        <aside class="sidebar" aria-label="Điều hướng">
          <div class="sidebar-brand">
            <span class="brand-icon" aria-hidden="true">♫</span>
            <span class="brand-name">Music</span>
          </div>
          <p class="sidebar-label">Duyệt nhạc</p>
          <button class="nav hidden" data-view="library">
            <span class="nav-icon" aria-hidden="true">☰</span>
            <span class="nav-label">Thư viện</span>
          </button>
          <button class="nav hidden" data-view="moods">
            <span class="nav-icon" aria-hidden="true">☺</span>
            <span class="nav-label">Theo tâm trạng</span>
          </button>
          <button class="nav hidden" data-view="genres">
            <span class="nav-icon" aria-hidden="true">◇</span>
            <span class="nav-label">Theo thể loại</span>
          </button>
          <button class="nav hidden" data-view="artists">
            <span class="nav-icon" aria-hidden="true">⚿</span>
            <span class="nav-label">Theo ca sĩ</span>
          </button>
          <button class="nav" data-view="playlists">
            <span class="nav-icon" aria-hidden="true">📂</span>
            <span class="nav-label">Playlist</span>
          </button>
          <button class="nav hidden" data-view="search">
            <span class="nav-icon" aria-hidden="true">⌕</span>
            <span class="nav-label">Tìm kiếm</span>
          </button>
          <p class="sidebar-label hidden">Trực tuyến</p>
          <button class="nav" data-view="youtube">
            <span class="nav-icon" aria-hidden="true">▶</span>
            <span class="nav-label">YouTube</span>
          </button>
        </aside>

        <section class="content">
          <header class="content-head">
            <div>
              <h1 id="content-title" class="content-title">Thư viện</h1>
              <p id="content-caption" class="content-caption">Danh sách nhạc của bạn</p>
            </div>
            <button id="choose-music" class="primary hidden">＋ Chọn nhạc</button>
          </header>
          <div id="youtube-player-section" class="yt-player-section hidden" aria-label="Trình phát YouTube">
            <div id="youtube-player"></div>
          </div>
          <div id="view"></div>
        </section>
      </section>

      <footer class="player">
        <div class="player-now">
          <span id="playing-avatar" class="avatar" aria-hidden="true">♪</span>
          <div class="player-meta">
            <div id="current-title" class="playing-title">Chưa chọn bài hát</div>
            <div id="current-artist" class="player-subtitle">Music Tray Player</div>
          </div>
        </div>

        <div class="player-center">
          <div class="controls">
            <button id="previous" class="player-control" aria-label="Bài trước" title="Bài trước">◀▮</button>
            <button id="play-pause" class="player-control play" aria-label="Phát" title="Phát">▶</button>
            <button id="next" class="player-control" aria-label="Bài tiếp theo" title="Bài tiếp theo">▮▶</button>
          </div>
          <div class="progress">
            <div class="progress-line">
              <span id="elapsed">0:00</span>
              <input id="seek" type="range" min="0" max="100" value="0" aria-label="Tiến trình bài hát" />
              <span id="duration">0:00</span>
            </div>
          </div>
        </div>

        <div class="player-extra">
          <label class="volume">
            <span aria-hidden="true">⌁</span>
            <input id="volume" type="range" min="0" max="1" step="0.01" value="0.8" aria-label="Âm lượng" />
          </label>
        </div>
      </footer>
    </main>

    <div id="status" role="status" aria-live="polite"></div>

    <dialog id="artist-dialog">
      <form id="artist-form" class="dialog-body">
        <h3>Tạo danh sách ca sĩ</h3>
        <p>Đặt tên ca sĩ, sau đó kéo thả nhạc từ File Explorer vào hàng của họ.</p>
        <input id="artist-name" name="artist-name" autocomplete="off" maxlength="80" placeholder="Ví dụ: Minh Khang" required />
        <div class="dialog-actions">
          <button id="artist-cancel" type="button" class="secondary">Hủy</button>
          <button type="submit" class="primary">Tạo danh sách</button>
        </div>
      </form>
    </dialog>

    <dialog id="playlist-dialog">
      <form id="playlist-form" class="dialog-body">
        <h3>Tạo Playlist mới</h3>
        <p>Nhập tên playlist để lưu trữ các bài hát bạn yêu thích.</p>
        <input id="playlist-name" name="playlist-name" autocomplete="off" maxlength="80" placeholder="Ví dụ: Nhạc Chill buổi tối" required />
        <div class="dialog-actions">
          <button id="playlist-cancel" type="button" class="secondary">Hủy</button>
          <button type="submit" class="primary">Tạo playlist</button>
        </div>
      </form>
    </dialog>

    <audio id="audio" preload="metadata"></audio>
    <script src="https://www.youtube.com/iframe_api"></script>
    <script src="playlist.js"></script>
    <script src="youtube.js"></script>
    <script src="renderer.js"></script>
  </body>
</html>
